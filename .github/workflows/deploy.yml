name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Eleventy
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: erpnext-automation
          directory: _site
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  index-with-google:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Write GCP service account key
        run: echo '${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}' > gcp-service-account.json

      - name: Install google-indexing-script
        run: npm install -g google-indexing-script

      - name: Run Google Indexing
        run: |
          google-indexing-script https://erpnext-automation.pages.dev/
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ./gcp-service-account.json

      - name: Cleanup key
        if: always()
        run: rm -f gcp-service-account.json

name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Eleventy
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages

  index-with-google:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    env:
      GCP_SA: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check secret present
        run: |
          if [ -z "$GCP_SA" ]; then
            echo "GCP_SERVICE_ACCOUNT_JSON not set — skipping indexing"
            exit 0
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install google-indexing-script
        run: npm install -g google-indexing-script

      - name: Write GCP service account key
        run: |
          mkdir -p ~/.gis
          echo "$GCP_SA" > ~/.gis/service_account.json

      - name: Run Google Indexing
        run: google-indexing-script https://martyh888.github.io/erpnext-automation/

      - name: Cleanup key
        if: always()
        run: rm -f ~/.gis/service_account.json
